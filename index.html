<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CRM — Выездные заказы</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f5f5f3; color: #1a1a1a; min-height: 100vh; -webkit-text-size-adjust: 100%; }

  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
  .login-card { background: #fff; border-radius: 12px; border: 0.5px solid rgba(0,0,0,.1); padding: 2rem; width: 100%; max-width: 360px; }
  .login-logo { font-size: 18px; font-weight: 500; margin-bottom: 1.5rem; }
  .login-logo span { color: #888; font-weight: 400; }
  .login-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
  .login-field label { font-size: 12px; color: #888; font-weight: 500; }
  .login-error { font-size: 13px; color: #c0392b; margin-bottom: 12px; min-height: 18px; }

  .app { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1rem; display: none; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 10px; }
  .logo { font-size: 17px; font-weight: 500; }
  .logo span { color: #888; font-weight: 400; }
  .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .conn-status { font-size: 12px; color: #999; display: flex; align-items: center; }
  .status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; background: #ccc; }
  .status-dot.ok { background: #27ae60; }
  .status-dot.err { background: #e74c3c; }
  .role-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
  .role-badge.admin { background: #f0f0f0; color: #333; }
  .role-badge.spec { background: #e8f4fd; color: #1a6fa8; }
  .btn-logout { padding: 5px 12px; border-radius: 6px; border: 0.5px solid rgba(0,0,0,.15); background: transparent; font-size: 12px; cursor: pointer; color: #666; }
  .tabs { display: flex; gap: 2px; background: #e5e5e5; border-radius: 8px; padding: 3px; }
  .tab { padding: 6px 14px; border-radius: 6px; border: none; background: transparent; cursor: pointer; font-size: 13px; color: #666; transition: all .15s; }
  .tab.active { background: #fff; color: #1a1a1a; font-weight: 500; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .section { display: none; }
  .section.visible { display: block; }

  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 1.25rem; }
  .stat { background: #fff; border-radius: 8px; padding: .75rem 1rem; border: 0.5px solid rgba(0,0,0,.1); }
  .stat-label { font-size: 11px; color: #888; margin-bottom: 2px; }
  .stat-value { font-size: 20px; font-weight: 500; }

  .toolbar { display: flex; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
  .toolbar-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .toolbar-label { font-size: 12px; color: #888; white-space: nowrap; }
  .search-input { padding: 7px 10px; border: 0.5px solid rgba(0,0,0,.15); border-radius: 8px; font-size: 14px; font-family: inherit; outline: none; width: 180px; background: #fff; }
  .date-input { padding: 7px 8px; border: 0.5px solid rgba(0,0,0,.15); border-radius: 8px; font-size: 13px; font-family: inherit; outline: none; background: #fff; color: #1a1a1a; }
  .btn-preset { padding: 6px 11px; border-radius: 7px; border: 0.5px solid rgba(0,0,0,.15); background: #fff; font-size: 12px; cursor: pointer; color: #555; transition: all .12s; }
  .btn-preset.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .divider { width: 0.5px; height: 18px; background: rgba(0,0,0,.12); margin: 0 2px; }

  .table-wrap { background: #fff; border-radius: 12px; border: 0.5px solid rgba(0,0,0,.1); overflow: hidden; }
  .desktop-view { display: block; }
  .mobile-view { display: none; }

  @media (max-width: 700px) {
    .desktop-view { display: none; }
    .mobile-view { display: block; }
    .stats { gap: 6px; }
    .stat-value { font-size: 16px; }
    .stat-label { font-size: 10px; }
    .search-input { width: 100%; }
    .divider { display: none; }
  }
  @media (max-width: 400px) {
    .stats { grid-template-columns: 1fr 1fr; }
  }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { padding: 9px 12px; text-align: left; font-weight: 500; font-size: 11px; color: #888; border-bottom: 0.5px solid rgba(0,0,0,.08); background: #fafafa; white-space: nowrap; }
  td { padding: 11px 12px; border-bottom: 0.5px solid rgba(0,0,0,.06); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafafa; }
  .sum-cell { font-weight: 500; }
  .badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 11px; background: #f0f0f0; color: #555; }
  .actions { display: flex; gap: 5px; }
  .btn-icon { width: 28px; height: 28px; border-radius: 6px; border: 0.5px solid rgba(0,0,0,.12); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #666; font-size: 14px; transition: all .12s; }
  .btn-icon:hover { background: #f0f0f0; }
  .btn-icon.danger:hover { background: #fff0f0; color: #c0392b; border-color: #ffbcbc; }

  .order-card { padding: 12px 16px; border-bottom: 0.5px solid rgba(0,0,0,.07); position: relative; min-height: 118px; }
  .order-card:last-child { border-bottom: none; }
  .card-addr-row { font-size: 14px; font-weight: 500; word-break: break-word; margin-bottom: 3px; }
  .card-date-row { font-size: 14px; font-weight: 700; color: #f5a623; margin-bottom: 3px; }
  .card-name-row { font-size: 14px; color: #444; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-bottom: 2px; }
  .card-name-row .card-name { font-weight: 500; }
  .card-name-row .card-phone { white-space: nowrap; }
  .card-row3 { font-size: 12px; color: #aaa; display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; padding-right: 105px; }
  .card-sum { font-weight: 500; color: #1a1a1a; }
  .card-sum-inline { font-weight: 700; font-size: 14px; color: #1a1a1a; white-space: nowrap; }
  .card-bottom { position: absolute; bottom: 12px; right: 16px; }
  .card-actions-icons { display: flex; flex-direction: column; gap: 5px; align-items: flex-end; }
  .card-actions { display: flex; gap: 8px; margin-top: 8px; }
  .card-actions-icons { display: flex; gap: 5px; }
  .card-btn { padding: 4px 12px; border-radius: 6px; border: 0.5px solid rgba(0,0,0,.15); background: transparent; font-size: 12px; cursor: pointer; color: #555; }
  .card-btn.danger { color: #c0392b; border-color: #f5bcbc; }

  .empty { padding: 2.5rem; text-align: center; color: #aaa; font-size: 14px; }
  .loading { padding: 2rem; text-align: center; color: #aaa; font-size: 14px; }

  .form-card { background: #fff; border-radius: 12px; border: 0.5px solid rgba(0,0,0,.1); padding: 1.5rem; max-width: 560px; }
  .form-title { font-size: 16px; font-weight: 500; margin-bottom: 1.25rem; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field.full { grid-column: 1 / -1; }
  label { font-size: 12px; color: #888; font-weight: 500; }
  input { border: 0.5px solid rgba(0,0,0,.18); border-radius: 8px; padding: 8px 10px; font-size: 14px; font-family: inherit; color: #1a1a1a; background: #fff; outline: none; width: 100%; transition: border-color .12s; }
  input:focus { border-color: rgba(0,0,0,.4); }
  .form-actions { display: flex; gap: 10px; margin-top: 1.25rem; flex-wrap: wrap; }
  .btn-primary { padding: 9px 20px; border-radius: 8px; border: none; background: #1a1a1a; color: #fff; font-size: 14px; font-weight: 500; cursor: pointer; }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
  .btn-secondary { padding: 9px 20px; border-radius: 8px; border: 0.5px solid rgba(0,0,0,.15); background: transparent; font-size: 14px; cursor: pointer; color: #666; }
  .form-note { font-size: 12px; color: #aaa; margin-top: 8px; }

  @media (max-width: 500px) {
    .form-grid { grid-template-columns: 1fr; }
    .field.full { grid-column: 1; }
  }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 999; white-space: nowrap; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="login-wrap" id="login-wrap">
  <div class="login-card">
    <div class="login-logo">CRM <span>/ выездные заказы</span></div>
    <div class="login-field"><label>Email</label><input id="l-email" type="email" placeholder="you@example.com" onkeydown="if(event.key==='Enter')window.doLogin()"></div>
    <div class="login-field"><label>Пароль</label><input id="l-pass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')window.doLogin()"></div>
    <div class="login-error" id="login-error"></div>
    <button class="btn-primary" id="login-btn" onclick="window.doLogin()" style="width:100%">Войти</button>
  </div>
</div>

  function fmt(d, t) {
    if (!d) return '';
    const [y, m, day] = d.split('-');
    const days = ['вс','пн','вт','ср','чт','пт','сб'];
    const dow = days[new Date(+y, +m-1, +day).getDay()];
    return day+'.'+m+'.'+y+' ('+dow+')'+(t?' '+t:'');
  }

  async function syncToSheets(order) {
    try {
      const params = new URLSearchParams();
      Object.keys(order).forEach(k => params.append(k, order[k] || ''));
      const img = new Image();
      img.src = SHEETS_URL + '?' + params.toString();
    } catch(e) { console.warn('Sheets sync failed:', e); }
  }

  window.setPreset = function(p) {
    ['week','month','all'].forEach(x => document.getElementById('pre-'+x).classList.toggle('active', x===p));
    const today = new Date();
    if (p==='week') { const e=new Date(); e.setDate(today.getDate()+7); document.getElementById('date-from').value=toYMD(today); document.getElementById('date-to').value=toYMD(e); }
    else if (p==='month') { const e=new Date(); e.setDate(today.getDate()+30); document.getElementById('date-from').value=toYMD(today); document.getElementById('date-to').value=toYMD(e); }
    else { document.getElementById('date-from').value=''; document.getElementById('date-to').value=''; }
    window.applyFilters();
  };

  window.onDateChange = function() {
    ['week','month','all'].forEach(p => document.getElementById('pre-'+p).classList.remove('active'));
    window.applyFilters();
  };

  window.applyFilters = function() {
    const from = document.getElementById('date-from').value;
    const to = document.getElementById('date-to').value;
    const q = document.getElementById('search-input').value.toLowerCase();
    let f = allOrders;
    if (from) f = f.filter(o => o.date >= from);
    if (to)   f = f.filter(o => o.date <= to);
    if (q)    f = f.filter(o => (o.name||'').toLowerCase().includes(q)||(o.addr||'').toLowerCase().includes(q)||(o.phone||'').toLowerCase().includes(q));
    f.sort((a,b) => {
      if (a.date !== b.date) return a.date.localeCompare(b.date);
      return (a.time || '').localeCompare(b.time || '');
    });
    renderList(f);
  };

  function updateStats(orders) {
    document.getElementById('st-total').textContent = orders.length;
    document.getElementById('st-sum').textContent = orders.reduce((s,o)=>s+(Number(o.sum)||0),0).toLocaleString('ru')+' ₽';

  }

  function buildTableHead() {
    const h = document.getElementById('table-head');
    if (isAdmin) h.innerHTML = '<th>Адрес</th><th>Клиент</th><th>Телефон</th><th>Дата и время</th><th>Сумма</th><th>Объём заказа</th><th>Источник</th><th>Специалист</th><th></th>';
    else         h.innerHTML = '<th>Адрес</th><th>Клиент</th><th>Дата и время</th><th>Сумма</th><th>Объём заказа</th><th>Источник</th><th>Специалист</th>';
  }

  function renderList(orders) {
    const tbody = document.getElementById('orders-body');
    const cards = document.getElementById('cards-list');
    const empty = document.getElementById('empty-state');
    const table = document.getElementById('main-table');
    document.getElementById('loading-state').style.display = 'none';
    tbody.innerHTML = ''; cards.innerHTML = '';
    updateStats(orders);
    if (!orders.length) { table.style.display='none'; empty.style.display='block'; return; }
    table.style.display = 'table'; empty.style.display = 'none';

    orders.forEach(o => {
      const tr = document.createElement('tr');
      if (isAdmin) {
        tr.innerHTML = `<td>${o.addr}</td><td>${o.name}</td><td><a href="tel:${o.phone}" style="color:inherit;text-decoration:none">${o.phone}</a></td><td>${fmt(o.date,o.time)}</td><td class="sum-cell">${o.sum?Number(o.sum).toLocaleString('ru')+' ₽':'—'}</td><td>${o.vol||'—'}</td><td><span class="badge">${o.src||'—'}</span></td><td>${o.spec||'—'}</td><td><div class="actions"><button class="btn-icon" onclick="window._edit('${o.id}')">✎</button><button class="btn-icon danger" onclick="window._del('${o.id}')">✕</button></div></td>`;
      } else {
        tr.innerHTML = `<td>${o.addr}</td><td>${o.name}</td><td>${fmt(o.date,o.time)}</td><td class="sum-cell">${o.sum?Number(o.sum).toLocaleString('ru')+' ₽':'—'}</td><td>${o.vol||'—'}</td><td><span class="badge">${o.src||'—'}</span></td><td>${o.spec||'—'}</td>`;
      }
      tbody.appendChild(tr);

      const card = document.createElement('div');
      card.className = 'order-card';
      const maskedPhone = o.phone ? o.phone.slice(0, -4) + '****' : '';
      const phoneRow = isAdmin ? `<span class="card-phone" id="ph-${o.id}">${maskedPhone}</span>` : '';
      const sumStr = o.sum ? Number(o.sum).toLocaleString('ru')+' ₽' : '';
      const sumSpan = sumStr ? `<span class="card-sum-inline">${sumStr}</span>` : '';
      const btns = isAdmin ? `<div class="card-actions-icons"><button class="btn-icon" onclick="window._edit('${o.id}')">✎</button><button class="btn-icon" onclick="window._revealPhone('${o.id}','${o.phone}')"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" style="display:block"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/><path d="M15 1v2c3.31 0 6 2.69 6 6h2c0-4.42-3.58-8-8-8z"/><path d="M15 5v2c1.1 0 2 .9 2 2h2c0-2.21-1.79-4-4-4z"/></svg></button><button class="btn-icon danger" onclick="window._del('${o.id}')">✕</button></div>` : '';
      const meta = [o.vol, o.src, o.spec].filter(Boolean);
      card.innerHTML = `
        <div class="card-addr-row">${o.addr}</div>
        <div class="card-date-row">${fmt(o.date,o.time)}</div>
        <div class="card-name-row"><span class="card-name">${o.name}</span>${phoneRow}${sumSpan}</div>
        ${meta.length ? `<div class="card-row3">${meta.map(m=>`<span>${m}</span>`).join('')}</div>` : ''}
        ${btns ? `<div class="card-bottom">${btns}</div>` : ''}`;
      cards.appendChild(card);
    });
  }

  function startListening() {
    if (unsubscribe) unsubscribe();
    const q = query(ordersCol, orderBy("date","asc"));
    unsubscribe = onSnapshot(q, snap => {
      allOrders = snap.docs.map(d=>({id:d.id,...d.data()}));
      setConn(true); window.applyFilters();
    }, () => { setConn(false); document.getElementById('loading-state').textContent='Ошибка загрузки.'; });
  }

  onAuthStateChanged(auth, user => {
    if (user) {
      isAdmin = ADMINS.includes(user.email);
      document.getElementById('login-wrap').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      const badge = document.getElementById('role-badge');
      badge.textContent = isAdmin ? 'Админ' : 'Специалист';
      badge.className = 'role-badge ' + (isAdmin ? 'admin' : 'spec');
      document.getElementById('tab-add').style.display = isAdmin ? '' : 'none';
      buildTableHead(); initDates(); startListening();
    } else {
      document.getElementById('login-wrap').style.display = 'flex';
      document.getElementById('app').style.display = 'none';
      if (unsubscribe) { unsubscribe(); unsubscribe = null; }
    }
  });

  window.doLogin = async function() {
    const email = document.getElementById('l-email').value.trim();
    const pass = document.getElementById('l-pass').value;
    const btn = document.getElementById('login-btn');
    const err = document.getElementById('login-error');
    err.textContent = ''; btn.disabled = true; btn.textContent = 'Вход...';
    try {
      await signInWithEmailAndPassword(auth, email, pass);
    } catch(e) {
      const msgs = {'auth/invalid-credential':'Неверный email или пароль','auth/wrong-password':'Неверный пароль','auth/invalid-email':'Неверный email'};
      err.textContent = msgs[e.code] || 'Ошибка входа';
      btn.disabled = false; btn.textContent = 'Войти';
    }
  };

  window.doLogout = () => signOut(auth);

  window.showTab = function(t) {
    document.querySelectorAll('.tab').forEach((el,i) => el.classList.toggle('active', (t==='list'&&i===0)||(t==='form'&&i===1)));
    document.getElementById('sec-list').classList.toggle('visible', t==='list');
    document.getElementById('sec-form').classList.toggle('visible', t==='form');
  };

  function clearForm() {
    ['f-name','f-phone','f-addr','f-date','f-time','f-sum','f-src','f-spec','f-vol'].forEach(id => document.getElementById(id).value = '');
    editId = null;
    document.getElementById('form-title').textContent = 'Новый заказ';
    document.getElementById('save-btn').disabled = false;
    document.getElementById('save-btn').textContent = 'Сохранить заказ';
  }

  window.saveOrder = async function() {
    if (!isAdmin) return;
    const name = document.getElementById('f-name').value.trim();
    const phone = document.getElementById('f-phone').value.trim();
    const addr = document.getElementById('f-addr').value.trim();
    const date = document.getElementById('f-date').value;
    if (!name||!phone||!addr||!date) { alert('Заполните: имя, телефон, адрес, дата'); return; }
    const btn = document.getElementById('save-btn');
    btn.disabled = true; btn.textContent = 'Сохранение...';
    const order = {
      name, phone, addr, date,
      time: document.getElementById('f-time').value,
      sum: document.getElementById('f-sum').value,
      src: document.getElementById('f-src').value.trim(),
      spec: document.getElementById('f-spec').value.trim(),
      vol: document.getElementById('f-vol').value.trim()
    };
    try {
      if (editId) {
        await updateDoc(doc(db,"orders",editId), order);
        showToast('Заказ обновлён');
      } else {
        order.createdAt = Date.now();
        await addDoc(ordersCol, order);
        syncToSheets(order);
        showToast('Заказ добавлен');
      }
      clearForm(); window.showTab('list');
    } catch(e) {
      alert('Ошибка: ' + e.message);
      btn.disabled = false; btn.textContent = 'Сохранить заказ';
    }
  };

  window._edit = function(id) {
    if (!isAdmin) return;
    const o = allOrders.find(x => x.id===id); if (!o) return;
    editId = id;
    ['name','phone','addr','date','time','sum','src','spec','vol'].forEach(k => document.getElementById('f-'+k).value = o[k]||'');
    document.getElementById('form-title').textContent = 'Редактировать заказ';
    document.getElementById('save-btn').disabled = false;
    document.getElementById('save-btn').textContent = 'Сохранить заказ';
    window.showTab('form');
  };

  window._del = async function(id) {
    if (!isAdmin || !confirm('Удалить заказ?')) return;
    try { await deleteDoc(doc(db,"orders",id)); showToast('Заказ удалён'); }
    catch(e) { alert('Ошибка: ' + e.message); }
  };

  window.cancelEdit = function() { clearForm(); window.showTab('list'); };

  window._revealPhone = function(id, phone) {
    const el = document.getElementById('ph-' + id);
    if (el) el.innerHTML = `<a href="tel:${phone}" style="color:inherit;text-decoration:none">${phone}</a>`;
  };
</script>
</body>
</html>
